[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-scene-authoring"
version = "0.1.0"
description = "External scene authoring plugin for MuJoCo Studio"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.13.1,<3.15",
  "numpy>=1.24",
]

[project.scripts]
mujoco-scene-authoring = "run_studio:main"

[tool.setuptools]
packages = ["scene_authoring"]
py-modules = ["run_studio"]

[tool.uv]
package = true
